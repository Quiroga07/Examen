openapi: 3.0.3
info:
  title: ABC Software Corp. - Enterprise Management & Electronic Invoicing API
  description: |
    Formal REST API contract for ABC Software Corp.'s modernized enterprise system.
    This specification establishes the interface boundaries for warehouse inventory movements,
    product catalog management, SUNAT catalog queries, taxpayer RUC verification, electronic invoice and credit/debit note issuance,
    document baja/lifecycle/CDR retrieval, and non-destructive legacy data migration reconciliation.

    ### Architectural & Compliance Rules:
    1. **Project Standard**: OpenAPI 3.0.3 is selected as the baseline contract standard unless the course evaluation committee specifies otherwise.
    2. **Strict Internal Scope**: Defines only endpoints belonging to this application. No external SUNAT, PSE, or OSE service URLs or endpoints are invented.
    3. **Regulatory Segregation**: GRE, DispatchAdvice, transport, and sandbox operations are outside the assessed API scope.
    4. **Traceability**: Every operation declares `x-requirement-ids` mapping directly to confirmed requirements (`FR-xxx`, `NFR-xxx`, `UC-xxx`, `AC-xxx`).
    5. **Security**: Operations require HTTP bearer authentication. Token issuance, claims, and role assignment are outside this contract; no credentials or external authentication endpoints are specified.
  version: 1.0.0
  contact:
    name: Architecture & Engineering Team - ABC Software Corp.
servers:
  - url: /api/v1
    description: Current Application Base Path (Modular Monolith / REST Adapter)

security:
  - bearerAuth: []

paths:
  # =========================================================================
  # 1. Warehouse & Inventory Management
  # =========================================================================
  /warehouse/inbound-movements:
    post:
      summary: Record incoming warehouse goods
      description: |
        Records an incoming warehouse movement without assuming a specific business cause.
        Records the movement date and any known internal document number separately from SUNAT
        numbering, and increments the physical stock balance for each line item.
      operationId: recordInboundMovement
      x-requirement-ids:
        - FR-001
        - FR-002
        - FR-003
        - FR-005
        - NFR-009
        - UC-001
        - AC-003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInboundMovementRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Inbound movement recorded and stock successfully incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseMovementResponse'
        '400':
          description: Invalid request payload or missing mandatory fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (e.g., unknown product ID, quantity <= 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal processing failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /warehouse/outbound-movements:
    post:
      summary: Record outgoing warehouse goods
      description: |
        Records outgoing warehouse movements associated with assessed wholesale or retail operations.
        Verifies stock availability, decrements inventory balances, prevents unauthorized negative stock,
        and preserves any known internal document number.
      operationId: recordOutboundMovement
      x-requirement-ids:
        - FR-002
        - FR-004
        - FR-005
        - FR-006
        - UC-002
        - AC-004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutboundMovementRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Outbound movement recorded and stock decremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseMovementResponse'
        '400':
          description: Invalid request payload or formatting error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict due to insufficient stock balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity (e.g., missing customer on wholesale operation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal processing failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 2. Product Catalog Management
  # =========================================================================
  /products:
    get:
      summary: List product catalog items
      description: Retrieves the active commercial catalog of groceries and general merchandise.
      operationId: listProducts
      x-requirement-ids:
        - FR-001
        - FR-006
        - AC-001
      parameters:
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Filter only active commercial products
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Array of catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCatalogItem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create new catalog product
      description: Adds a new grocery or merchandise item to the central catalog with unit price and tax classification.
      operationId: createProduct
      x-requirement-ids:
        - FR-001
        - FR-006
        - FR-011
        - AC-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCatalogItem'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCatalogItem'
        '400':
          description: Invalid product attributes or price < 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product code (SKU) already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}:
    get:
      summary: Get product by ID
      description: Retrieves detailed attributes for a specific product item.
      operationId: getProductById
      x-requirement-ids:
        - FR-001
        - AC-001
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: Unique product identifier
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Product retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCatalogItem'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalogs/{catalogNumber}:
    get:
      summary: Query SUNAT catalog entries
      description: Returns code and description entries for the requested supported SUNAT catalog.
      operationId: getSunatCatalog
      x-requirement-ids:
        - FR-011
        - FR-023
        - UC-013
        - AC-024
      parameters:
        - name: catalogNumber
          in: path
          required: true
          schema:
            type: string
          description: SUNAT catalog number supported by the application
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SunatCatalogEntry'
        '404':
          description: Catalog is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 3. Tax Identity & RUC Validation
  # =========================================================================
  /tax/ruc/validate:
    post:
      summary: Validate Peruvian Taxpayer RUC number
      description: |
        Evaluates a candidate 11-digit Peruvian single taxpayer registration number (RUC).
        Verifies numerical length, legal identity prefixes (10, 15, 17, 20), and statutory check criteria.
        
        *Notice on Rules & Integration*: In accordance with the teacher's assessment, no external SUNAT scrape
        endpoints or unverified methods are assumed. Details on whether validation executes purely via offline
        Modulo 11 check digit or via online SUNAT padrón queries are subject to confirmation under Q-13.
      operationId: validateRucNumber
      x-requirement-ids:
        - FR-007
        - NFR-009
        - UC-003
        - AC-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRucRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: RUC validation result successfully evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateRucResponse'
        '400':
          description: Malformed input (not an 11-digit numeric string)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal validation service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 4. Peruvian Electronic Invoicing (CPE)
  # =========================================================================
  /invoices:
    post:
      summary: Issue Electronic Payment Receipt (Factura or Boleta)
      description: |
        Calculates applicable taxes, validates customer tax identity, assigns standardized series and
        correlative numbering, generates compliant UBL 2.1 XML, applies digital signature (XMLDSig),
        and persists the electronic document. Business-specific ISC inputs are governed by the approved
        tax specifications and are not assumed by this contract.
      operationId: issueElectronicInvoice
      x-requirement-ids:
        - FR-006
        - FR-007
        - FR-008
        - FR-009
        - FR-011
        - FR-012
        - NFR-009
        - NFR-010
        - UC-004
        - UC-005
        - AC-007
        - AC-008
        - AC-009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueElectronicInvoiceRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Electronic invoice issued, taxes calculated, and XML generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicInvoiceResponse'
        '202':
          description: Invoice request accepted; processing is pending. The invoice resource is available at Location.
          headers:
            Location:
              description: URI of the invoice resource to query for its current lifecycle state
              required: true
              schema:
                type: string
                format: uri-reference
        '409':
          description: Invoice numbering conflicts with an existing document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Missing mandatory invoice headers, line items, or customer identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Tax calculation violation, invalid RUC checksum, or unmapped SUNAT catalog code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: XML generation or digital signing exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}:
    get:
      summary: Get electronic invoice status and details
      description: Retrieves invoice totals, tax breakdown, current lifecycle state, and transmission CDR details.
      operationId: getInvoiceById
      x-requirement-ids:
        - FR-012
        - AC-009
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: System unique invoice identifier
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Invoice details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicInvoiceResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}/xml:
    get:
      summary: Download generated UBL 2.1 XML document
      description: Returns the raw or digitally signed UBL 2.1 XML document corresponding to the invoice.
      operationId: getInvoiceXml
      x-requirement-ids:
        - FR-009
        - NFR-010
        - UC-005
        - AC-009
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: System unique invoice identifier
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: UBL 2.1 XML document payload
          content:
            application/xml:
              schema:
                type: string
        '404':
          description: Invoice or XML payload not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}/notes:
    post:
      summary: Issue a credit or debit note
      description: Creates an electronic credit or debit note associated with the identified original Factura or Boleta.
      operationId: issueCreditDebitNote
      x-requirement-ids:
        - FR-021
        - FR-009
        - FR-011
        - FR-012
        - UC-011
        - AC-022
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the original Factura or Boleta resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditDebitNoteRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Credit or debit note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicInvoiceResponse'
        '400':
          description: Malformed note request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Original invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Note numbering conflicts with an existing document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Note request cannot be processed with the supplied line data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}/baja:
    post:
      summary: Request electronic document baja
      description: Submits a baja request for the identified electronic document through the configured provider integration boundary.
      operationId: requestInvoiceBaja
      x-requirement-ids:
        - FR-022
        - FR-012
        - UC-012
        - AC-023
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Identifier of the electronic document for which baja is requested
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Baja request accepted for processing; retrieve the document at Location for its subsequent lifecycle state.
          headers:
            Location:
              description: URI of the electronic document resource
              required: true
              schema:
                type: string
                format: uri-reference
        '404':
          description: Electronic document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Communication failure with the configured provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}/cdr:
    get:
      summary: Download archived CDR artifact
      description: Returns the archived CDR artifact for an invoice after processing by the configured provider.
      operationId: getInvoiceCdr
      x-requirement-ids:
        - FR-010
        - FR-012
        - UC-006
        - AC-010
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: System unique invoice identifier
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Archived CDR artifact
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: Invoice or archived CDR artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoices/{documentId}/transmit:
    post:
      summary: Transmit invoice to authorized electronic invoicing provider
      description: |
        Packages the signed XML payload according to the configured provider protocol, transmits it
        through the authorized provider adapter, parses the returned CDR (Constancia de Recepción),
        and transitions the document state according to the response.
      operationId: transmitInvoice
      x-requirement-ids:
        - FR-010
        - FR-012
        - NFR-012
        - UC-006
        - AC-010
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: System unique invoice identifier
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Transmission completed and CDR response processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectronicInvoiceResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Document is not in a transmittable status (e.g., already accepted or not signed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: External provider gateway or communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 5. Legacy Migration & Reconciliation
  # =========================================================================
  /migration/runs:
    post:
      summary: Trigger non-destructive legacy data migration cycle
      description: |
        Accepts a request for read-only staging extraction from the Visual FoxPro 9 database.
        Processing verifies SHA-256 file immutability, transforms validated records into domain entities,
        logs non-conforming rows to the exception repository, and proves mathematical reconciliation:
        Total Source = Migrated + Rejected. Retrieve the completed result from the run resource.
      operationId: executeMigrationRun
      x-requirement-ids:
        - FR-015
        - FR-016
        - NFR-007
        - NFR-008
        - UC-008
        - AC-014
        - AC-015
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Migration request accepted for asynchronous processing; the run resource is available at Location.
          headers:
            Location:
              description: URI of the migration run resource to query for its reconciliation result
              required: true
              schema:
                type: string
                format: uri-reference
        '409':
          description: Legacy database file hash mismatch or file lock detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Migration pipeline execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /migration/runs/{migrationRunId}:
    get:
      summary: Get migration audit and reconciliation report
      description: Retrieves the detailed audit metrics and reconciliation totals for a past migration run.
      operationId: getMigrationRunById
      x-requirement-ids:
        - FR-016
        - NFR-008
        - AC-015
      parameters:
        - name: migrationRunId
          in: path
          required: true
          schema:
            type: string
          description: Unique migration execution batch ID
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Reconciliation audit report retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReconciliationSummary'
        '404':
          description: Migration batch ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # -----------------------------------------------------------------------
    # Warehouse Schemas
    # -----------------------------------------------------------------------
    MovementLine:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          description: Identifier of product item
          example: PROD-001
        quantity:
          type: number
          format: double
          minimum: 0.01
          description: Physical quantity
          example: 120.00
        unitCost:
          type: number
          format: double
          minimum: 0.00
          nullable: true
          description: Unit acquisition cost (optional per Q-18)
          example: 4.50

    CreateInboundMovementRequest:
      type: object
      required:
        - transactionDate
        - lines
      properties:
        transactionDate:
          type: string
          format: date
          description: Date of the inbound movement; no time or timezone is inferred from the legacy case
          example: '2026-10-22'
        internalDocumentNumber:
          type: string
          nullable: true
          description: Known internal document number; format and generation policy remain open under Q-14
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MovementLine'

    CreateOutboundMovementRequest:
      type: object
      required:
        - transactionDate
        - lines
      properties:
        transactionDate:
          type: string
          format: date
          description: Date of the outbound movement; no time or timezone is inferred from the legacy case
          example: '2026-10-22'
        internalDocumentNumber:
          type: string
          nullable: true
          description: Known internal document number; format and generation policy remain open under Q-14
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MovementLine'

    WarehouseMovementResponse:
      type: object
      required:
        - movementId
        - movementType
        - transactionDate
        - totalItemCount
        - totalQuantity
        - status
      properties:
        movementId:
          type: string
          description: Immutable system movement ID
          example: mov-987a-bc12
        internalDocumentNumber:
          type: string
          nullable: true
          description: Known internal document number when available; format and generation policy remain open under Q-14
        movementType:
          type: string
          enum:
            - INBOUND
            - OUTBOUND
          example: INBOUND
        transactionDate:
          type: string
          format: date
          example: '2026-10-22'
        totalItemCount:
          type: integer
          example: 1
        totalQuantity:
          type: number
          format: double
          example: 120.00
        status:
          type: string
          enum:
            - POSTED
          example: POSTED

    ProductCatalogItem:
      type: object
      required:
        - productId
        - productCode
        - description
        - unitOfMeasure
        - unitPrice
        - currency
        - taxCategory
        - isActive
      properties:
        productId:
          type: string
          example: prod-001
        productCode:
          type: string
          maxLength: 30
          example: GROC-RICE-50K
        description:
          type: string
          maxLength: 250
          example: Arroz Superior 50kg Saco
        unitOfMeasure:
          type: string
          description: SUNAT Cat. 03 code (e.g., KGM, NIU)
          example: KGM
        unitPrice:
          type: number
          format: double
          minimum: 0.00
          description: Base sales price
          example: 165.00
        currency:
          type: string
          enum:
            - PEN
            - USD
          example: PEN
        taxCategory:
          type: string
          description: SUNAT Cat. 07 affectation code (e.g., 10 Gravado, 20 Exonerado)
          example: '10'
        isActive:
          type: boolean
          example: true

    SunatCatalogEntry:
      type: object
      required:
        - code
        - description
      properties:
        code:
          type: string
          description: SUNAT catalog entry code
        description:
          type: string
          description: Catalog-provided entry description

    # -----------------------------------------------------------------------
    # Tax Identity Schemas
    # -----------------------------------------------------------------------
    ValidateRucRequest:
      type: object
      required:
        - rucNumber
      properties:
        rucNumber:
          type: string
          pattern: '^[0-9]{11}$'
          description: Candidate 11-digit Peruvian RUC string
          example: '20123456789'

    ValidateRucResponse:
      type: object
      required:
        - rucNumber
        - isValid
        - validationMessage
        - verificationSource
      properties:
        rucNumber:
          type: string
          example: '20123456789'
        isValid:
          type: boolean
          description: True if length, prefix, and check digit pass
          example: true
        validationMessage:
          type: string
          example: RUC candidate satisfies statutory validation rules
        legalPrefix:
          type: string
          nullable: true
          description: Extracted prefix (e.g., 20 Legal Entity, 10 Natural Person)
          example: '20'
        verificationSource:
          type: string
          enum:
            - OFFLINE_MODULO_11
            - ONLINE_SUNAT_PADRON
          description: Verification mechanism used (subject to Q-13)
          example: OFFLINE_MODULO_11

    CustomerIdentity:
      type: object
      required:
        - identityType
        - identityNumber
        - legalName
      properties:
        identityType:
          type: string
          enum:
            - '1' # DNI
            - '4' # Carnet de Extranjería
            - '6' # RUC
            - '7' # Pasaporte
          description: SUNAT Cat. 06 document type
          example: '6'
        identityNumber:
          type: string
          description: Customer tax identity number (11 digits for RUC)
          example: '20123456789'
        legalName:
          type: string
          maxLength: 200
          description: Legal corporate or natural person name
          example: Distribuidora Los Andes S.A.C.
        fiscalAddress:
          type: string
          nullable: true
          description: Legal tax fiscal address (mandatory for wholesale Facturas)
          example: Av. Nicolás de Piérola 450, Lima, Perú

    # -----------------------------------------------------------------------
    # Invoicing Schemas
    # -----------------------------------------------------------------------
    InvoiceLineItem:
      type: object
      required:
        - lineNumber
        - productId
        - description
        - quantity
        - unitPrice
        - taxExemptionReasonCode
      properties:
        lineNumber:
          type: integer
          minimum: 1
          example: 1
        productId:
          type: string
          example: prod-001
        description:
          type: string
          example: Arroz Superior 50kg Saco
        quantity:
          type: number
          format: double
          minimum: 0.01
          example: 10.00
        unitPrice:
          type: number
          format: double
          minimum: 0.00
          description: Unit price excluding tax
          example: 165.00
        taxExemptionReasonCode:
          type: string
          description: SUNAT Catalog 07 value serialized at UBL TaxCategory/cbc:TaxExemptionReasonCode
          example: '10'
        iscCalculation:
          $ref: '#/components/schemas/IscCalculation'
        pricingReference:
          $ref: '#/components/schemas/PricingReference'

    IscCalculation:
      type: object
      required:
        - systemCode
        - iscAmount
      description: >
        Line-level ISC inputs and result. Populate only when ISC applies; product applicability,
        rates, units, and schedule-specific values remain open under Q-11.
      properties:
        systemCode:
          type: string
          enum: ['01', '02', '03']
          description: SUNAT Catalog 08 ISC calculation system
        taxableBase:
          type: number
          format: double
          minimum: 0
        quantity:
          type: number
          format: double
          minimum: 0
        unitOfMeasure:
          type: string
          description: Statutory measurement unit when required by the applicable schedule
        ratePercent:
          type: number
          format: double
          minimum: 0
        amountPerUnit:
          type: number
          format: double
          minimum: 0
        publicSalePrice:
          type: number
          format: double
          minimum: 0
        tierRange:
          type: string
          description: UBL TaxCategory/cbc:TierRange when required by the applicable SUNAT validation rule
        iscAmount:
          type: number
          format: double
          minimum: 0
          description: Calculated ISC amount for this invoice line

    PricingReference:
      type: object
      properties:
        alternativePriceAmount:
          type: number
          format: double
          minimum: 0
        priceTypeCode:
          type: string
          enum: ['01', '02', '03']
          description: SUNAT Catalog 16 code serialized at AlternativeConditionPrice/PriceTypeCode

    IssueElectronicInvoiceRequest:
      type: object
      required:
        - documentType
        - series
        - issueDate
        - currency
        - customer
        - lines
      properties:
        documentType:
          type: string
          enum:
            - '01' # Factura
            - '03' # Boleta de Venta
          description: SUNAT Cat. 01 code
          example: '01'
        series:
          type: string
          pattern: '^[FB][0-9A-Z]{3}$'
          description: Standard series (F### for Facturas, B### for Boletas)
          example: F001
        issueDate:
          type: string
          format: date
          description: Calendar date serialized as UBL cbc:IssueDate
          example: '2026-10-22'
        currency:
          type: string
          enum:
            - PEN
            - USD
          example: PEN
        operationTypeCode:
          type: string
          description: SUNAT Catalog 51 value serialized as UBL ProfileID where applicable; selection and profile scheme remain open under Q-22
        paymentTerms:
          $ref: '#/components/schemas/PaymentTerms'
        legend1000:
          type: string
          description: Amount-in-words legend text serialized as cbc:Note with languageLocaleID 1000 where required
        customer:
          $ref: '#/components/schemas/CustomerIdentity'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'

    PaymentTerms:
      type: object
      properties:
        paymentCondition:
          type: string
          enum: [CONTADO, CREDITO]
        netPendingAmount:
          type: number
          format: double
          minimum: 0
          description: Net amount pending when the payment condition is credit
        installments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInstallment'

    PaymentInstallment:
      type: object
      properties:
        installmentNumber:
          type: string
        dueDate:
          type: string
          format: date
        amount:
          type: number
          format: double
          minimum: 0

    CreateCreditDebitNoteRequest:
      type: object
      required:
        - documentType
        - lines
      properties:
        documentType:
          type: string
          enum:
            - '07'
            - '08'
          description: SUNAT Catalog 01 code for credit note or debit note
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'

    TaxBreakdown:
      type: object
      required:
        - taxableAmount
        - igvAmount
        - iscAmount
        - exoneratedAmount
        - inafectAmount
        - totalDiscounts
      properties:
        taxableAmount:
          type: number
          format: double
          minimum: 0.00
          description: Operations subject to IGV
          example: 1650.00
        igvAmount:
          type: number
          format: double
          minimum: 0.00
          description: Calculated 18% IGV (half-up rounding to 2 decimals)
          example: 297.00
        iscAmount:
          type: number
          format: double
          minimum: 0.00
          description: Calculated Selective Consumption Tax
          example: 0.00
        iscLineDetails:
          type: array
          items:
            $ref: '#/components/schemas/IscCalculation'
        exoneratedAmount:
          type: number
          format: double
          minimum: 0.00
          description: Exempt operations (Apéndice I Ley IGV)
          example: 0.00
        inafectAmount:
          type: number
          format: double
          minimum: 0.00
          example: 0.00
        totalDiscounts:
          type: number
          format: double
          minimum: 0.00
          example: 0.00

    CdrResult:
      type: object
      required:
        - cdrCode
        - cdrDescription
        - receivedTimestamp
      properties:
        cdrCode:
          type: string
          description: >-
            Raw SUNAT response code. 0 indicates acceptance; 2000-3999 indicate
            rejection errors; 4000 and above are observations. Codes 0100-0999
            and 1000-1999 are service/submission exceptions, not CDR acceptance
            or rejection outcomes.
          example: '0'
        cdrDescription:
          type: string
          example: La Factura F001-00000042 ha sido aceptada
        receivedTimestamp:
          type: string
          format: date-time
          example: '2026-10-22T10:01:15Z'
        cdrFileHash:
          type: string
          nullable: true
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        notes:
          type: array
          nullable: true
          items:
            type: string

    ElectronicInvoiceResponse:
      type: object
      required:
        - documentId
        - legalNumber
        - documentType
        - taxSummary
        - totalPayable
        - currency
        - lifecycleStatus
      properties:
        documentId:
          type: string
          example: inv-550e8400-e29b-41d4
        legalNumber:
          type: string
          example: F001-00000042
        documentType:
          type: string
          enum:
            - '01'
            - '03'
            - '07'
            - '08'
          example: '01'
        taxSummary:
          $ref: '#/components/schemas/TaxBreakdown'
        totalPayable:
          type: number
          format: double
          description: Grand total payable (TaxableBase + Taxes)
          example: 1947.00
        currency:
          type: string
          enum:
            - PEN
            - USD
          example: PEN
        lifecycleStatus:
          type: string
          enum:
            - DRAFT
            - GENERATED
            - SIGNED
            - TRANSMITTED
            - ACCEPTED
            - REJECTED
            - CANCELLED
          example: SIGNED
        xmlDigest:
          type: string
          nullable: true
          example: 3c59dc048e8850243be8079a5c74d079
        cdrDetails:
          $ref: '#/components/schemas/CdrResult'

    # -----------------------------------------------------------------------
    # Migration & Reconciliation Schemas
    # -----------------------------------------------------------------------
    MigrationReconciliationSummary:
      type: object
      required:
        - migrationRunId
        - sourceTableName
        - totalSourceRecords
        - successfullyMigrated
        - rejectedRecords
        - reconciliationFormulaValid
        - executionTimestamp
      properties:
        migrationRunId:
          type: string
          example: mig-batch-20261022-01
        sourceTableName:
          type: string
        totalSourceRecords:
          type: integer
          example: 1540
        successfullyMigrated:
          type: integer
          example: 1532
        rejectedRecords:
          type: integer
          example: 8
        reconciliationFormulaValid:
          type: boolean
          description: True if TotalSource == SuccessfullyMigrated + RejectedRecords
          example: true
        executionTimestamp:
          type: string
          format: date-time
          example: '2026-10-22T04:15:30Z'

    # -----------------------------------------------------------------------
    # Standard Error Schema
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          description: Machine-readable uppercase error token
          example: INVALID_RUC_CHECKSUM
        message:
          type: string
          description: Human-readable failure message
          example: The provided customer RUC does not satisfy statutory validation rules.
        target:
          type: string
          nullable: true
          description: Specific property or field that caused the error
          example: customer.identityNumber
        timestamp:
          type: string
          format: date-time
          example: '2026-10-22T10:30:00Z'
        details:
          type: array
          nullable: true
          items:
            type: string
          example:
            - 'Modulo 11 check digit calculated: 7, received: 9'
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller is not authorized to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
